<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
        <rect x="0" y="0" width="100" height="100" fill="burlywood" />
        <path
          d="M 10 10 H 90 V 90 L 10 60"
          fill="transparent"
          stroke="black"
          stroke-width="3"
        />
        <circle cx="50" cy="50" r="20" class="svg-circle" />
        <g class="svg-text-group">
          <text x="20" y="25" rotate="10" id="hello-text">Hello!</text>
          <use href="#hello-text" x="-10" y="65" fill="white" />
        </g>
      </svg>

      <svg width="340" height="340">
        <rect
          x="80"
          y="100"
          width="500"
          height="500"
          rx="100"
          ry="100"
          stroke="green"
          stroke-width="5"
          fill="none"
        />
      </svg>

      <svg width="300" height="300">
        <rect
          x="60"
          y="110"
          width="132"
          height="79"
          fill="none"
          stroke="oklch(0.9 0.3 164)"
          stroke-width="5"
        />
      </svg>

      <svg width="300" height="300">
        <ellipse
          cx="140"
          cy="140"
          rx="60"
          ry="120"
          fill="none"
          stroke="oklch(0.9 0.3 164)"
          stroke-width="5"
        />
      </svg>

      <svg width="300" height="300">
        <polygon
          points="
      60,100
      100,180
      140,140
      180,180
      220,100
    "
        />
      </svg>

      <svg width="255" viewBox="0 0 300 220">
        <circle
          cx="150"
          cy="110"
          r="60"
          stroke="var(--gold)"
          stroke-width="10"
        />
      </svg>
      <style>
        circle {
          stroke: hsl(45deg 100% 50%);
          stroke-width: 6px;
          stroke-dasharray: 20, 14;
          stroke-linecap: butt;
        }
      </style>

      <svg viewBox="0 0 200 200">
        <circle cx="100" cy="100" r="50" />
      </svg>
    </div>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=home"
    />

    <span class="material-symbols-outlined"> home </span>
  </body>
</html>
